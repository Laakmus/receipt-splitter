<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Receipt Splitter{% endblock %}</title>
    <style>
        :root {
            --bg: #fff; --fg: #222; --muted: #666; --line: #ddd; --head: #f4f4f4;
            --warn-bg: #fff4e5; --warn-line: #ffb84d; --ok-bg: #eef7ee; --ok-line: #99cc99;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1c; --fg: #e8e8e8; --muted: #a0a0a0; --line: #3a3a3a; --head: #2a2a2a;
                --warn-bg: #3a2e1a; --warn-line: #8a6d3b; --ok-bg: #1e2f1e; --ok-line: #4d7a4d;
            }
        }
        body { font-family: system-ui, sans-serif; margin: 2rem; background: var(--bg); color: var(--fg); }
        h1 { font-size: 1.4rem; }
        table { border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
        th { background: var(--head); }
        td.num, th.num { text-align: right; }
        td.check { text-align: center; }
        .muted { color: var(--muted); font-size: 0.9rem; }
        .warn { background: var(--warn-bg); border: 1px solid var(--warn-line); padding: 10px; margin: 1rem 0; }
        .totals { background: var(--ok-bg); border: 1px solid var(--ok-line); padding: 10px 14px; display: inline-block; }
        .totals td { border: none; padding: 3px 14px 3px 0; }
        form.inline { display: inline; }
        nav a { margin-right: 1rem; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'receipt-upload' %}">Wgraj paragon</a>
    <a href="{% url 'receipt-list' %}">Wszystkie paragony</a>
</nav>
<hr>
{% block content %}{% endblock %}
</body>
</html>
